{% extends "public_base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<style>
  .alert-success{
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.30);
    color: #14532d;
    padding: 10px 12px;
    border-radius: 12px;
    font-weight: 700;
    margin: 10px 0 14px;
  }
  .login-help{
    margin-top: 10px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 10px;
    font-size: 14px;
  }
  .login-help a{
    color: #14532d;
    text-decoration: none;
    font-weight: 700;
  }
  .login-help a:hover{
    text-decoration: underline;
  }
</style>

<section class="card card--spaced" style="max-width:420px;margin:20px auto;">
  <h1 style="margin:0 0 10px 0;">Acceder</h1>

  {% if error %}
    <div style="padding:10px;border:1px solid rgba(0,0,0,.12);border-radius:12px;margin-bottom:10px;">
      {{ error }}
    </div>
  {% endif %}

  {% if reset_ok %}
    <div class="alert-success">
      ✅ Contraseña cambiada. Ya puedes iniciar sesión.
    </div>
  {% endif %}

  <form method="post" action="/login">
    <label style="display:block;margin:10px 0 6px;">Usuario o Email</label>
    <input name="identifier" type="text" required style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.15);">

    <label style="display:block;margin:10px 0 6px;">Contraseña</label>
    <input name="password" type="password" required style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.15);">

    <div class="login-help">
      <a href="/auth/forgot-password">¿Has olvidado la contraseña?</a>
    </div>

    <button type="submit" style="margin-top:14px;width:100%;padding:10px;border-radius:12px;border:0;background:#14532d;color:#fff;">
      Entrar
    </button>
  </form>
</section>

{% endblock %}
