<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin · Golf Mode{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/styles.css?v=17" />
  {% block head_extra %}{% endblock %}
</head>

<body class="gm-body {% block body_class %}{% endblock %}">

  {% block header %}
    {% include "components/admin_topbar.html" %}
  {% endblock %}

  <main class="gm-wrap {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <!-- Reutiliza el mismo JS del topbar -->
  <script src="/static/public_topbar.js?v=1"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
