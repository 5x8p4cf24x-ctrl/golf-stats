<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin · Golf Mode{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/styles.css?v=19">
  {% block head_extra %}{% endblock %}
</head>

<body class="gm-body {% block body_class %}{% endblock %}">

  <div class="admin-sticky">
    {% include "components/admin_topbar.html" %}
    {% block breadcrumbs %}{% endblock %}
  </div>

  <main class="gm-wrap admin-main {% block container_class %}{% endblock %}">
    {% block page_header %}{% endblock %}
    {% block content %}{% endblock %}
  </main>

  <script src="/static/public_topbar.js?v=1"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
