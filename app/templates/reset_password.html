{% extends "public_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <div class="gm-wrap" style="max-width:520px;margin:0 auto;padding:20px 12px;">
    <h1 style="margin:0 0 10px 0;">Cambiar contraseña</h1>
    <p style="color:#6b7280;margin:0 0 16px 0;">Escribe tu nueva contraseña.</p>

    {% if error %}
      <div style="background:#fee2e2;border:1px solid #fecaca;color:#991b1b;padding:10px 12px;border-radius:12px;margin-bottom:12px;">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/auth/reset-password">
      <input type="hidden" name="token" value="{{ token }}"/>

      <label style="display:block;margin:10px 0 6px 0;">Nueva contraseña</label>
      <input name="password1" type="password" required style="width:100%;height:44px;border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:0 12px;"/>

      <label style="display:block;margin:10px 0 6px 0;">Repetir contraseña</label>
      <input name="password2" type="password" required style="width:100%;height:44px;border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:0 12px;"/>

      <button type="submit" style="margin-top:14px;width:100%;height:44px;border:0;border-radius:12px;background:#14532d;color:#fff;font-weight:800;">
        Guardar
      </button>
    </form>

    <div style="margin-top:12px;">
      <a href="/login" style="color:#14532d;font-weight:700;text-decoration:none;">Volver a login</a>
    </div>
  </div>
{% endblock %}
