{% extends "admin_base.html" %}

{% block title %}Admin · Login{% endblock %}
{% block header_title %}Acceso admin{% endblock %}
{% block header_subtitle %}Introduce la clave para acceder al panel.{% endblock %}

{% block content %}
<section class="card admin-form-card" style="max-width:480px; margin: 40px auto;">

  {% if error %}
    <div style="margin-bottom:16px; padding:10px 12px; border-radius:10px; background:rgba(220,38,38,.08); color:#dc2626; font-weight:700;">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/admin/login">

    <div class="admin-field">
      <label>Clave admin</label>
      <input name="key" type="password" placeholder="Introduce la clave" required>
    </div>

    <div class="admin-form-actions" style="margin-top:14px;">
      <button class="btn-gm" type="submit">
        Entrar
      </button>
    </div>

  </form>

</section>
{% endblock %}
