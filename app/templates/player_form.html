<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <h1>{{ title }}</h1>

    <section class="card">
      <form method="post" enctype="multipart/form-data">

        <label>Nombre</label><br/>
        <input name="name" value="{{ player.name if player else '' }}" required/>
        <br/><br/>

        <label>Apodo</label><br/>
        <input name="nickname" value="{{ player.nickname if player else '' }}"/>
        <br/><br/>

        <label>Nº licencia</label><br/>
        <input type="text" name="license_number" value="{{ player.license_number if player else '' }}">
        <br/><br/>

        <!-- 📸 Foto -->
        <label>Foto (opcional)</label><br/>
        {% if player and player.photo_url %}
          <img src="/uploads/{{ player.photo_url }}"
               alt="Foto jugador"
               style="width:80px; height:80px; object-fit:cover; border-radius:50%; display:block; margin-bottom:8px;">
        {% endif %}
        <input type="file" name="photo">
        <br/><br/>

        <!-- 🎯 HCP -->
        <label>HCP exacto</label><br/>
        <input
          name="hcp_exact"
          id="hcp_exact"
          type="number"
          step="0.1"
          value="{{ player.hcp_exact if player else 0 }}"
        />
        <br/>

        {% if player and player.license_number %}
          <button type="button" id="btnRefreshHcp" style="margin-top:6px;">
            🔄 Actualizar HCP (RFEG)
          </button>
          <span id="hcpMsg" style="margin-left:10px; font-size:0.9em;"></span>
          <br/><br/>
        {% else %}
          <br/>
        {% endif %}

        <label>Activo</label>
        <input
          name="active"
          type="checkbox"
          {% if player and player.active %}checked{% endif %}
        />
        <br/><br/>

        <button type="submit">Guardar</button>
      </form>
    </section>

    <p><a href="/admin/players">Volver</a></p>
  </main>

  {% if player and player.license_number %}
  <script>
  (function () {
    const btn = document.getElementById("btnRefreshHcp");
    const msg = document.getElementById("hcpMsg");
    const hcpInput = document.getElementById("hcp_exact");

    if (!btn) return;

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      msg.textContent = "Actualizando desde RFEG…";

      try {
        const res = await fetch("/admin/players/{{ player.id }}/handicap/refresh", {
          method: "POST"
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          msg.textContent = data.error || "Error al actualizar";
          return;
        }

        hcpInput.value = data.hcp_exact;
        msg.textContent = "✅ HCP actualizado a " + data.hcp_exact;
      } catch (e) {
        msg.textContent = "❌ Error de red";
      } finally {
        btn.disabled = false;
      }
    });
  })();
  </script>
  {% endif %}
</body>
</html>
