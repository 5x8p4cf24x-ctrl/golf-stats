{% set p = request.url.path %}

<header class="gm-topbar gm-topbar--admin">
  <div class="gm-topbar-inner">

    <!-- Brand Admin (tu imagen) -->
    <a class="gm-brand" href="/admin" aria-label="Golf Mode Admin">
      <img class="gm-brand-logo gm-brand-logo--admin"
           src="/static/golfmode_admin.png"
           alt="Golf Mode Admin">
    </a>

    <nav class="gm-topnav" aria-label="Navegación admin">
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/players') else '' }}" href="/admin/players">Jugadores</a>
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/courses') else '' }}" href="/admin/courses">Campos</a>
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/rounds') else '' }}" href="/admin/rounds">Rondas</a>
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/leagues') else '' }}" href="/admin/leagues">Ligas</a>
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/tournaments') else '' }}" href="/admin/tournaments">Copas</a>
      <a class="gm-topnav-link {{ 'is-active' if p == '/admin/rounds/new' else '' }}" href="/admin/rounds/new">Nueva partida</a>
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/achievements') else '' }}" href="/admin/achievements">Logros</a>
      <a class="gm-topnav-link {{ 'is-active' if p.startswith('/admin/news') else '' }}" href="/admin/news">Noticias</a>
    </nav>

    <a class="gm-topbar-cta gm-topbar-cta--ghost" href="/public">Ver público</a>

    <button class="gm-burger" type="button" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- Menú móvil -->
<div class="gm-mobile-overlay" id="gmMobileOverlay">
  <div class="gm-mobile-menu" id="gmMobileMenu">
    <a class="gm-mobile-link" href="/admin/players">Jugadores</a>
    <a class="gm-mobile-link" href="/admin/courses">Campos</a>
    <a class="gm-mobile-link" href="/admin/rounds">Rondas</a>
    <a class="gm-mobile-link" href="/admin/leagues">Ligas</a>
    <a class="gm-mobile-link" href="/admin/tournaments">Copas</a>
    <a class="gm-mobile-link" href="/admin/rounds/new">Nueva partida</a>
    <a class="gm-mobile-link" href="/admin/achievements">Logros</a>
    <a class="gm-mobile-link" href="/admin/news">Noticias</a>
    <a class="gm-mobile-link" href="/public">Ver público</a>
  </div>
</div>
