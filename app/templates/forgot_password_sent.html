{% extends "public_base.html" %}
{% block content %}
<div class="gm-wrap" style="max-width:520px;margin:0 auto;padding:20px 12px;">
  <h1 style="margin:0 0 10px 0;">Revisa tu email</h1>
  <p style="color:#6b7280;margin:0 0 16px 0;">
    Si existe una cuenta con <strong>{{ email }}</strong>, te llegará un enlace para cambiar la contraseña.
  </p>
  <a href="/login" style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 14px;border-radius:12px;background:#14532d;color:#fff;font-weight:800;text-decoration:none;">
    Volver a login
  </a>
</div>
{% endblock %}
