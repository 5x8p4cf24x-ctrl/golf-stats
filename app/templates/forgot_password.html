{% extends "public_base.html" %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}

<style>
  .forgot-card{
    max-width:420px;
    margin:40px auto;
  }
  .forgot-card input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid rgba(0,0,0,.15);
    box-sizing:border-box;
  }
  .forgot-card button{
    margin-top:14px;
    width:100%;
    padding:10px;
    border-radius:12px;
    border:0;
    background:#14532d;
    color:#fff;
    font-weight:700;
  }
  .forgot-help{
    margin-top:14px;
    font-size:14px;
  }
  .forgot-help a{
    color:#14532d;
    font-weight:700;
    text-decoration:none;
  }
  .forgot-help a:hover{
    text-decoration:underline;
  }
  .forgot-info{
    font-size:14px;
    margin-bottom:16px;
    opacity:.8;
  }
</style>

<section class="card card--spaced forgot-card">
  <h1 style="margin:0 0 10px 0;">Recuperar contraseña</h1>

  <p class="forgot-info">
    Introduce tu email y te enviaremos un enlace para crear una nueva contraseña.
  </p>

  <form method="post" action="/auth/password-reset/request">
    <label style="display:block;margin:10px 0 6px;">Email</label>
    <input type="email" name="email" placeholder="Tu email" required>

    <button type="submit">Enviar enlace</button>
  </form>

  <div class="forgot-help">
    <a href="/login">← Volver a login</a>
  </div>
</section>

{% endblock %}
