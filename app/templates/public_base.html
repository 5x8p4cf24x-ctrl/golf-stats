<!doctype html>
<html lang="es">
<head>
  <link rel="apple-touch-icon" sizes="180x180"
      href="/static/apple-touch-icon.png?v=20260123">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Golf Mode{% endblock %}</title>

  <!-- Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/styles.css?v=17" />
  {% block head_extra %}{% endblock %}
</head>

<body class="gm-body {% block body_class %}{% endblock %}">
  {% block header %}
    {% include "components/public_topbar.html" %}
  {% endblock %}

  {% block breadcrumbs %}{% endblock %}

  <main class="gm-wrap {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/public_topbar.js?v=1"></script>
  <script src="/static/news_share.js?v=1"></script>

  {% block scripts %}{% endblock %}
  {% block body_extra %}{% endblock %}
</body>

</html>
